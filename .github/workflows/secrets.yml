name: Sync secrets
# Pushes app secrets from GitHub → Fly without touching SESSION_SECRET (which Provision generates once).
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl secrets set --app unwindwords \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            LOGIN_FROM_EMAIL="${{ vars.LOGIN_FROM_EMAIL || 'login@unwindwords.com' }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Billing (Stripe): each is skipped, rather than set to empty, when the GitHub secret
      # isn't there yet -- so an org that hasn't added them doesn't blank out a value someone
      # set by hand on Fly.
      - run: |
          declare -A stripe_secrets=(
            [STRIPE_SECRET_KEY]="${{ secrets.STRIPE_SECRET_KEY }}"
            [STRIPE_WEBHOOK_SECRET]="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            [STRIPE_PRICE_MONTHLY]="${{ secrets.STRIPE_PRICE_MONTHLY }}"
            [STRIPE_PRICE_YEARLY]="${{ secrets.STRIPE_PRICE_YEARLY }}"
          )
          args=()
          for name in "${!stripe_secrets[@]}"; do
            value="${stripe_secrets[$name]}"
            if [ -n "$value" ]; then
              args+=("$name=$value")
            else
              echo "skipping $name (no GitHub secret set)"
            fi
          done
          if [ "${#args[@]}" -gt 0 ]; then
            flyctl secrets set --app unwindwords "${args[@]}"
          else
            echo "no Stripe secrets to sync"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Hosted LLM tier (src/dyslexic_rewrite/rewrite/llm.py, docs/RESEARCH.md section 4):
      # same skip-rather-than-blank pattern as the Stripe secrets above.
      - run: |
          declare -A llm_secrets=(
            [DYSREWRITE_LLM_BASE_URL]="${{ secrets.DYSREWRITE_LLM_BASE_URL }}"
            [DYSREWRITE_LLM_MODEL]="${{ secrets.DYSREWRITE_LLM_MODEL }}"
            [DYSREWRITE_LLM_API_KEY]="${{ secrets.DYSREWRITE_LLM_API_KEY }}"
          )
          args=()
          for name in "${!llm_secrets[@]}"; do
            value="${llm_secrets[$name]}"
            if [ -n "$value" ]; then
              args+=("$name=$value")
            else
              echo "skipping $name (no GitHub secret set)"
            fi
          done
          if [ "${#args[@]}" -gt 0 ]; then
            flyctl secrets set --app unwindwords "${args[@]}"
          else
            echo "no LLM secrets to sync"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
