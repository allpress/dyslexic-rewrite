name: Sync secrets
# Pushes app secrets from GitHub → Fly without touching SESSION_SECRET (which Provision generates once).
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl secrets set --app unwindwords \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            LOGIN_FROM_EMAIL="${{ vars.LOGIN_FROM_EMAIL || 'login@unwindwords.com' }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
