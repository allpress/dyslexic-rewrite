# Fly.io app config. Provisioned by .github/workflows/provision.yml; deployed by deploy.yml.
app = "unwindwords"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  APP_NAME = "Unwind Words"
  SECURE_COOKIES = "1"
  DEV_CODE_FALLBACK = "1"   # remove once unwindwords.com is verified in Resend
  AUDIO_DIR = "/data/recordings"

[mounts]
  source = "audio"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
