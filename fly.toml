# Fly.io app config. Provisioned by .github/workflows/provision.yml; deployed by deploy.yml.
app = "unwindwords"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  APP_NAME = "Unwind Words"
  SECURE_COOKIES = "1"
  DEV_CODE_FALLBACK = "1"   # remove once unwindwords.com is verified in Resend
  AUDIO_DIR = "/data/recordings"
  PUBLIC_BASE_URL = "https://unwindwords.com"
  BOOKS_DIR = "/data/books"
  # Hosted LLM tier (Pro's "llm" book engine, src/dyslexic_rewrite/rewrite/llm.py). The base
  # URL/model are not secret; DYSREWRITE_LLM_API_KEY is set via .github/workflows/secrets.yml,
  # never here. Uncomment once a DeepSeek key is provisioned -- see docs/RESEARCH.md section 4.
  # DYSREWRITE_LLM_BASE_URL = "https://api.deepseek.com/v1"
  # DYSREWRITE_LLM_MODEL = "deepseek-flash"
  DYSREWRITE_LLM_MAX_CONCURRENCY = "4"

[mounts]
  source = "audio"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
